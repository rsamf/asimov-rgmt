[project]
name = "asimov-rgmt"
version = "1.0.0"
description = "RGMT motion-tracking trainer for the Asimov v1 humanoid on Newton physics"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Richard Franklin" }]
requires-python = ">=3.12"
dependencies = [
    "hydra-core>=1.3.3",
    "nebo[deploy]>=0.3.4",
    "newton>=1.5.0,<1.6",
    "mujoco-warp>=3.11",
    "mujoco>=3.11",
    "warp-lang>=1.16",
    "torch>=2.7.0",
    "numpy>=1.26",
    "yourdfpy>=0.0.56",
    "safetensors>=0.4.0",
    "omegaconf>=2.3",
    "pyglet>=2.1.15",
]

[project.urls]
Repository = "https://github.com/rsamf/asimov-rgmt"
Model = "https://huggingface.co/rsamf/asimov-rgmt-medium"
Dataset-Pipeline = "https://github.com/rsamf/asimov-gmr"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["rgmt"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
